{% extends 'base.html' %}
{% block content %}
<div class="form-container">
    <h2>Login</h2>
    <form method="POST">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Masuk</button>
    </form>

    <div style="text-align:center; margin:16px 0; color:#888; font-size:14px;">— atau —</div>

    <a href="{{ url_for('google.login') }}"
       style="display:flex; align-items:center; justify-content:center; gap:10px; background:white; border:2px solid #ddd; padding:12px; border-radius:8px; font-weight:600; color:#333; transition:all 0.2s; text-decoration:none;">
        <img src="https://www.google.com/favicon.ico" width="20">
        Login dengan Google
    </a>

    <div class="link-bawah">
        Belum punya akun? <a href="/register">Daftar di sini</a>
    </div>
</div>
{% endblock %}
